# Local dev stack for the In-Office Hours Assistant: the bot + Redis + a WireMock Employee Data API stub.
#   1. copy .env.example -> .env and set AZURE_OPENAI_API_KEY (kept out of git)
#   2. docker compose up --build
#   3. point the Bot Framework Emulator at http://localhost:5234/api/messages (empty app id/password)
#
# Note: a full turn also needs Microsoft Graph identity (Graph:ClientId/secret) - not stubbed here; without it
# the bot starts and serves /healthz, and E2E behaviour is covered by the TestAdapter tests.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  employee-data-api:
    image: wiremock/wiremock:3.9.1
    command: ["--port", "8080", "--global-response-templating"]
    ports:
      - "8080:8080"
    volumes:
      - ./build/wiremock:/home/wiremock

  bot:
    build:
      context: .
      dockerfile: build/Dockerfile
    ports:
      - "5234:5234"
    depends_on:
      - redis
      - employee-data-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      EmployeeApi__BaseUrl: http://employee-data-api:8080
      Redis__ConnectionString: redis:6379
      AzureOpenAI__Endpoint: https://aoai-teamsbot-aue.services.ai.azure.com
      AzureOpenAI__Deployment: gpt-5.4-mini
      AzureOpenAI__ApiKey: ${AZURE_OPENAI_API_KEY:-}
